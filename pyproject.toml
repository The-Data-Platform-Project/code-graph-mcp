[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-graph-mcp"
version = "1.0.0"
description = "Persistent, queryable code knowledge graph served over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp==1.28.1",
    "tree-sitter==0.26.0",
    "uvicorn==0.51.0",
    # Grammar wheels (see requirements.txt for the rationale).
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-html==0.23.2",
    "tree-sitter-css==0.25.0",
    "tree-sitter-yaml==0.7.2",
]

[project.scripts]
code-graph-mcp = "code_graph.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
