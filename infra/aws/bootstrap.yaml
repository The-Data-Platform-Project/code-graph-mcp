AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup for deploying the code-graph indexer from GitHub Actions:
  trust GitHub's OIDC issuer (no long-lived AWS keys in GitHub), a role only
  this repository's main branch can assume, an image repository and an
  artifacts bucket that clean up after themselves. Deploy once, by hand
  (docs/INDEXER_AWS.md); the workflow deploys everything else.

Parameters:
  GitHubRepository:
    Type: String
    Default: The-Data-Platform-Project/code-graph-mcp
    AllowedPattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
    Description: owner/name of the repository whose workflows may deploy.
  DeployBranch:
    Type: String
    Default: main
  StackPrefix:
    Type: String
    Default: code-graph-indexer
    Description: Name (prefix) of the indexer stack the role may manage.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "false" if this AWS account already has the
      token.actions.githubusercontent.com identity provider (only one may exist).

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref StackPrefix
      ImageScanningConfiguration:
        ScanOnPush: true
      # Old images are deleted, so storage stays inside ECR's free 500 MB.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep the last 3 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
            "action": {"type": "expire"}}]}

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-templates
            Status: Enabled
            ExpirationInDays: 30

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (OIDC) to deploy the code-graph indexer.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows on this repository's deploy branch.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${DeployBranch}
      Policies:
        - PolicyName: deploy-indexer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}*/*
              - Sid: SamTransform
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DescribeStacks
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Sid: PushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                Resource: !GetAtt ImageRepository.Arn
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # The roles SAM creates for the functions and the schedule are
              # named after the stack, so the deploy role can only touch those.
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}*
              - Sid: Services
                Effect: Allow
                Action:
                  - lambda:*
                  - sqs:*
                  - scheduler:*
                  - logs:*
                  - sns:*
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region

Outputs:
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  ImageRepositoryUri:
    Description: GitHub repository variable AWS_IMAGE_REPOSITORY.
    Value: !GetAtt ImageRepository.RepositoryUri
  ArtifactsBucketName:
    Description: GitHub repository variable AWS_ARTIFACTS_BUCKET.
    Value: !Ref ArtifactsBucket
